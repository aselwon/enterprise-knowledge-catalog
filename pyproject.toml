[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-catalog"
version = "0.1.0"
description = "Offline schema metadata retrieval and agent context service"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "psycopg[binary]==3.2.9"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.10"]

[project.scripts]
catalog = "catalog.cli:main"

[tool.setuptools.package-data]
catalog = ["schema.sql"]

[tool.setuptools.packages.find]
include = ["catalog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/tmp/knowledge-catalog-pytest-cache"

[tool.ruff]
target-version = "py312"
line-length = 100
